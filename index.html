<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>15 juillet 2028 · Compte à rebours</title>

    <!-- Favicon (sablier) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <header class="head">
            <p class="eyebrow">Compte à rebours</p>
            <h1 class="date"><time datetime="2028-07-15">15 juillet 2028</time></h1>
        </header>

        <!-- role="timer" : un compteur qui change seul, que les lecteurs d'écran n'annoncent pas à chaque seconde.
             Chaque unité est plus petite que la précédente : l'œil lit la hiérarchie sans effort. -->
        <section class="countdown" id="countdown" role="timer">
            <div class="unit unit-months">
                <span class="value" id="months">–</span>
                <span class="label">mois</span>
            </div>
            <div class="unit unit-days">
                <span class="value" id="days">–</span>
                <span class="label">jours</span>
            </div>
            <div class="unit unit-hours">
                <span class="value" id="hours">––</span>
                <span class="label">heures</span>
            </div>
            <div class="unit unit-minutes">
                <span class="value" id="minutes">––</span>
                <span class="label">minutes</span>
            </div>
            <div class="unit unit-seconds">
                <span class="value" id="seconds">––</span>
                <span class="label">secondes</span>
            </div>
        </section>

        <p class="total" id="total">soit <strong id="total-days">–</strong> jours en tout</p>

        <p class="done" id="done" hidden>C'est aujourd'hui.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
